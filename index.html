<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WeatherBoard — Your day, at a glance</title>
    <meta
      name="description"
      content="A simple, installable weather dashboard with live city search, a five-day forecast, saved cities, offline weather, and an optional daily reminder."
    />
    <meta name="theme-color" content="#0a111d" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeatherBoard" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="WeatherBoard — Your day, at a glance" />
    <meta
      property="og:description"
      content="Live city search, a five-day forecast, saved cities, and offline weather in a calm, installable dashboard."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var theme = localStorage.getItem('weatherboard:theme:v1')
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f6fa' : '#0a111d')
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
